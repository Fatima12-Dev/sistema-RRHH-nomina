services:
  mysql:
    image: mysql:8.4
    container_name: rrhh_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "12345"
      MYSQL_DATABASE: "rrhh_db"
    ports:
      - "3306:3306"
    volumes:
      - rrhh_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rrhh_mysql_data:
