spring.application.name=sistema-RRHH-nomina


spring.datasource.url=jdbc:mysql://localhost:3306/rrhh_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


rrhh.api.base-url=http://localhost:8080


spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=true


springdoc.api-docs.path=/v3/api-docs


scalar.enabled=true
scalar.path=/scalar
scalar.url=/v3/api-docs
scalar.theme=deepSpace
scalar.layout=modern
